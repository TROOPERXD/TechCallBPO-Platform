<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Transportation - TechCallBPO</title>
    <link rel="stylesheet" href="css/transportation.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <h1><i class="fas fa-bus"></i> Request Transportation</h1>
        <a href="dashboard.html" class="back-button"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </header>

    <main>
        <div class="container">
            <h2>Your Monthly Schedule</h2>
            <div class="calendar-container">
                <div class="calendar-header">
                    <button id="prev-month" title="Previous Month"><i class="fas fa-chevron-left"></i></button>
                    <h3 id="month-year"></h3>
                    <button id="next-month" title="Next Month"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="calendar-grid" id="calendar-grid">
                    <!-- Calendar days will be generated by JavaScript -->
                </div>
            </div>
            <div class="shift-details">
                <h3>Shift Information</h3>
                <p id="shift-info">Select a day to see your shift details.</p>
            </div>

            <div class="route-selection">
                <h3>Select Your Route</h3>
                <div class="route-option">
                    <h4>Morning Shift (Home to Site)</h4>
                    <label><input type="radio" name="morning-route" value="6am"> 6:00 AM</label>
                    <label><input type="radio" name="morning-route" value="7am"> 7:00 AM</label>
                </div>
                <div class="route-option">
                    <h4>Evening Shift (Site to Home)</h4>
                    <label><input type="radio" name="evening-route" value="5pm"> 5:00 PM</label>
                    <label><input type="radio" name="evening-route" value="6pm"> 6:00 PM</label>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2023 TechCallBPO. All rights reserved.</p>
    </footer>

    <script src="js/transportation.js"></script>
</body>
</html>
