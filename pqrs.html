<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PQRS - TechCallBPO</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pqrs.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <h1><i class="fas fa-file-alt"></i> Submit a PQR</h1>
        <a href="dashboard.html" class="back-button"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </header>

    <main>
        <div class="container">
            <h2>Submit your Petition, Complaint, or Suggestion</h2>
            <form id="pqr-form">
                <div class="form-group">
                    <label for="pqr-type">Type of Request</label>
                    <select id="pqr-type" name="pqr-type" required>
                        <option value="" disabled selected>Select a type</option>
                        <option value="petition">Petition</option>
                        <option value="complaint">Complaint</option>
                        <option value="suggestion">Suggestion</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="6" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Submit PQR</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2023 TechCallBPO. All rights reserved.</p>
    </footer>

    <script src="js/pqrs.js"></script>
</body>
</html>
